<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="PulseAI - real-time customer sentiment intelligence dashboard powered by a fine-tuned DistilBERT model." />
    <title>PulseAI · Sentiment Intelligence</title>
    <script>
      // Applied before first paint so a reload never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('pulseai-theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
