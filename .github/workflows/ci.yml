name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      # A standalone mongod is enough for the integration suite - none of those
      # tests need change streams, and GitHub service containers cannot easily
      # run rs.initiate for a replica set.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # CPU wheels only: the CUDA build is ~2 GB and CI has no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Lint
        run: ruff check src api tests

      - name: Test
        # No MONGODB_URI and no model checkpoint: the suite must pass against
        # the degraded path, which is exactly the behaviour worth guarding.
        env:
          MONGODB_URI: ''
          FALLBACK_MODEL: ''
        run: pytest tests -q

      - name: Integration tests (live MongoDB)
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
          FALLBACK_MODEL: ''
        run: pytest tests/test_integration.py -q

      - name: Verify the pipeline runs offline end to end
        # Uses the synthetic generator, so CI never depends on the Hugging Face
        # Hub being reachable or on a dataset licence.
        run: |
          python -m src.dataset --prepare --synthetic --train-size 300 --val-size 60 --test-size 60
          python -m src.train_baseline --no-tune
          python -m src.train_transformer --limit 24 --epochs 1 --batch-size 8 --output-dir /tmp/ci-model
          python scripts/update_reports.py

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder model directory
        # The checkpoint is a training artefact and is not committed; the image
        # build only needs the path to exist.
        run: mkdir -p models reports && echo '{}' > reports/metrics.json

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pulseai-api:ci

      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: false
          tags: pulseai-dashboard:ci
