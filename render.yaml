# Render blueprint for the PulseAI API.
#
# The free instance type works because this image serves a quantized ONNX model
# instead of PyTorch. Measured inside a container with a hard 512 MB cap:
#
#     torch + transformers ............. 601 MB   (would be OOM-killed)
#     onnxruntime + tokenizers ......... 199 MB   (38% of the limit)
#
# The 65 MB model is pulled from the Hub on first boot rather than committed,
# so nothing large lives in git.

services:
  - type: web
    name: pulseai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Secret - set in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DB
        value: pulseai

      # The quantized model. MODEL_DIR and FALLBACK_MODEL stay empty so the
      # loader does not try to pull the 268 MB PyTorch checkpoint, which would
      # not fit here.
      - key: ONNX_MODEL_REPO
        value: akashkeshari111/pulseai-distilbert-sentiment-onnx
      - key: MODEL_DIR
        value: /nonexistent
      - key: FALLBACK_MODEL
        value: ""

      - key: MAX_SEQ_LENGTH
        value: 256

      # The dashboard's Vercel origin.
      - key: CORS_ORIGINS
        value: https://pulseai-dashboard.vercel.app

      # Set a value here to require X-API-Key on write endpoints.
      - key: API_KEY
        sync: false

      # /tmp is writable on Render; the image default under /app is not
      # guaranteed to be across every plan.
      - key: HF_HOME
        value: /tmp/hf
